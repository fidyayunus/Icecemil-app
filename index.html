<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7a9c8">
<title>IceCemil • Portal</title>
<style>
:root{--pink:#f7a9c8;--blue:#b9e7f5;--cream:#fff8ef;--brown:#704b3b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Arial,sans-serif;background:linear-gradient(145deg,#fff5f8,#eefaff);color:var(--brown);display:grid;place-items:center;padding:22px}
main{width:min(100%,460px);background:#ffffffeb;border:1px solid #f6dce7;border-radius:28px;padding:30px 24px;box-shadow:0 18px 50px #80546b18;text-align:center}
.logo{font-size:54px;line-height:1.2}h1{margin:8px 0 4px;font-size:32px;color:#b85f88}p{margin:0 0 24px;color:#806c68}
nav{display:grid;gap:13px}a{display:block;text-decoration:none;padding:17px;border-radius:17px;font-weight:750;color:#704b3b;border:1px solid #f0dce3;background:#fff}a:nth-child(1){background:#ffe5ef}a:nth-child(2){background:#e3f6fc}a:nth-child(3){background:#fff0d9}a:active{transform:scale(.99)}
small{display:block;margin-top:22px;color:#927f79;line-height:1.5}
</style>
</head>
<body><main>
<div class="logo">🍦💗</div><h1>IceCemil</h1><p>Manisnya bikin happy!</p>
<nav aria-label="Pilih halaman">
<a href="./admin.html">🔐 Masuk Admin</a>
<a href="./cashier.html">🧾 Halaman Kasir</a>
<a href="./customer.html">🍨 Kartu Pelanggan</a>
</nav>
<section id="resetPanel" hidden style="margin-top:22px;text-align:left;background:#fff8fb;border:1px solid #f1d6e1;border-radius:18px;padding:18px">
<h2 style="margin:0 0 8px;color:#b85f88;font-size:20px">Buat Password Baru</h2>
<p style="margin:0 0 12px">Tautan pemulihan terdeteksi. Masukkan password baru untuk akun ini.</p>
<label for="newPassword" style="display:block;font-size:14px">Password baru</label>
<input id="newPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Minimal 8 karakter" style="width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ddd;border-radius:10px">
<label for="confirmPassword" style="display:block;font-size:14px">Ulangi password baru</label>
<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Ketik ulang password" style="width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ddd;border-radius:10px">
<button id="savePassword" style="width:100%;padding:13px;border:0;border-radius:12px;background:#e78eae;color:white;font-weight:700">Simpan Password Baru</button>
<p id="resetStatus" role="status" style="margin:12px 0 0;white-space:pre-wrap"></p>
</section>
<small id="portalNote">Portal resmi IceCemil. Akses sesuai peran masing-masing.</small>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  const SUPABASE_URL = "https://jalfjemcoowgsfzrxzim.supabase.co";
  const SUPABASE_KEY = "sb_publishable_ZuTXids4UK11IC3gONDcqg_f8aMtEYx";
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const panel = document.getElementById("resetPanel");
  const status = document.getElementById("resetStatus");
  const hash = new URLSearchParams(location.hash.slice(1));
  const query = new URLSearchParams(location.search);
  const isRecovery = hash.get("type") === "recovery" || query.get("type") === "recovery";
  if (!isRecovery) return;

  document.querySelector("nav").hidden = true;
  document.getElementById("portalNote").hidden = true;
  panel.hidden = false;

  document.getElementById("savePassword").addEventListener("click", async () => {
    const password = document.getElementById("newPassword").value;
    const confirm = document.getElementById("confirmPassword").value;
    if (password.length < 8) {
      status.textContent = "Password minimal 8 karakter.";
      return;
    }
    if (password !== confirm) {
      status.textContent = "Kedua password belum sama.";
      return;
    }
    const button = document.getElementById("savePassword");
    button.disabled = true;
    status.textContent = "Menyimpan password...";
    const { data: { session } } = await db.auth.getSession();
    if (!session) {
      status.textContent = "Sesi pemulihan tidak ditemukan atau tautan sudah kedaluwarsa. Minta email pemulihan baru.";
      button.disabled = false;
      return;
    }
    const { error } = await db.auth.updateUser({ password });
    if (error) {
      status.textContent = "Gagal menyimpan: " + error.message;
      button.disabled = false;
      return;
    }
    await db.auth.signOut();
    status.textContent = "Password berhasil diganti. Silakan masuk kembali melalui halaman Admin atau Kasir dengan password baru.";
    document.getElementById("newPassword").value = "";
    document.getElementById("confirmPassword").value = "";
    button.hidden = true;
    history.replaceState(null, "", location.pathname);
  });
})();
</script>
</main></body></html>
